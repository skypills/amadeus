[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "amadeus"
version = "1.3.0"
description = "Локальный ИИ-ассистент Amadeus для CachyOS: текстовое ядро и CLI"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "platformdirs>=4.0",
    "PySide6>=6.7",
    "ddgs>=9.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
amadeus = "amadeus.cli:main"
amadeus-gui = "amadeus.ui.window:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["amadeus"]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = true
