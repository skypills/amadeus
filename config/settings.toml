[provider]
name = "ollama"
allow_cloud = false
cloud_base_url = "https://api.openai.com/v1"
cloud_model = "gpt-4o-mini"
cloud_api_key_env = "AMADEUS_CLOUD_API_KEY"
cloud_fallback = true

[ollama]
base_url = "http://127.0.0.1:11434"
model = "qwen2.5:3b-instruct"
timeout = 120
stream = true

[generation]
temperature = 0.7
top_p = 0.9
max_tokens = 512
history_limit = 20
memory_limit = 5

[personality]
preset = "amadeus"
mood = "calm"
familiarity = 0.4
verbosity = 0.5
initiative = 0.3

[privacy]
send_history_to_cloud = false
send_facts_to_cloud = false

[tools]
model_calls = true

[search]
provider = "duckduckgo"
backend = "duckduckgo"
use_library = true
allow_model_calls = false
base_url = "https://html.duckduckgo.com/html/"
timeout = 15
max_results = 5

[security]
allowed_apps = ["alacritty", "chromium", "code", "dolphin", "firefox", "kitty", "spotify", "telegram-desktop", "thunar"]
confirm_app_launch = true

[voice]
stt_command = "whisper-cli"
stt_model = "~/.local/share/amadeus/models/ggml-base.bin"
stt_timeout = 300
tts_command = "piper"
tts_model = "~/.local/share/amadeus/models/ru_RU-irina-medium.onnx"
tts_timeout = 120
recorder_command = ""
player_command = ""
sample_rate = 16000
language = "ru"
auto_send = true
auto_speak = false
profile = "default"
length_scale = 1.0
noise_scale = 0.667
noise_w = 0.8
pitch_semitones = 0.0
